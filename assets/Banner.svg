<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="200" rx="14" fill="url(#bg)"/>
  <rect width="900" height="200" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="198" rx="13" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="900" height="34" rx="14" fill="#161b22"/>
  <rect x="0" y="20" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="17" r="6" fill="#27c93f"/>
  <text x="450" y="22" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#8b949e">dipesh@github ~ model_card.py</text>
  <line x1="0" y1="34" x2="900" y2="34" stroke="#30363d" stroke-width="1"/>

  <!-- prompt lines -->
  <text x="34" y="76" font-family="Consolas, Menlo, monospace" font-size="16" fill="#22d3ee">$ whoami</text>
  <text x="34" y="106" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="700" fill="#f0f6fc">Dipesh Shrestha</text>
  <text x="34" y="134" font-family="Consolas, Menlo, monospace" font-size="15" fill="#8b949e">AI/ML Engineer · Full-Stack Developer · Kathmandu, Nepal</text>

  <rect x="34" y="152" width="360" height="4" rx="2" fill="url(#accent)"/>

  <text x="34" y="180" font-family="Consolas, Menlo, monospace" font-size="13" fill="#7ee787">status: <tspan fill="#c9d1d9">training on new problems, open to collab</tspan></text>

  <!-- blinking cursor -->
  <rect x="620" y="63" width="10" height="18" fill="#a855f7">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
