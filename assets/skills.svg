<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a12"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid2" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#8b9bb4" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="280" rx="14" fill="url(#bg2)"/>
  <rect width="900" height="280" rx="14" fill="url(#grid2)"/>
  <rect x="1" y="1" width="898" height="278" rx="13" fill="none" stroke="#243043" stroke-width="1.2"/>

  <text x="28" y="34" font-family="Consolas, Menlo, monospace" font-size="13" fill="#22d3ee">// skill_matrix.log</text>
  <line x1="28" y1="46" x2="872" y2="46" stroke="#243043" stroke-width="1"/>

  <!-- row template: label at x=28, track at x=250 w=460, tag at x=730 -->

  <!-- Python -->
  <text x="28" y="82" font-family="Consolas, Menlo, monospace" font-size="14" fill="#c9d3e0">Python</text>
  <rect x="250" y="68" width="460" height="10" rx="5" fill="#182234"/>
  <rect x="250" y="68" width="0" height="10" rx="5" fill="url(#barFill)">
    <animate attributeName="width" from="0" to="424" dur="1.1s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1" values="0;424"/>
  </rect>
  <text x="730" y="77" font-family="Consolas, Menlo, monospace" font-size="11" fill="#5b6b85">PRIMARY</text>

  <!-- JS/TS -->
  <text x="28" y="126" font-family="Consolas, Menlo, monospace" font-size="14" fill="#c9d3e0">JavaScript</text>
  <rect x="250" y="112" width="460" height="10" rx="5" fill="#182234"/>
  <rect x="250" y="112" width="0" height="10" rx="5" fill="url(#barFill)">
    <animate attributeName="width" from="0" to="322" dur="1.1s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1" values="0;322"/>
  </rect>
  <text x="730" y="121" font-family="Consolas, Menlo, monospace" font-size="11" fill="#5b6b85">FREQUENT</text>

  <!-- PHP / Java -->
  <text x="28" y="170" font-family="Consolas, Menlo, monospace" font-size="14" fill="#c9d3e0">PHP · Java</text>
  <rect x="250" y="156" width="460" height="10" rx="5" fill="#182234"/>
  <rect x="250" y="156" width="0" height="10" rx="5" fill="url(#barFill)">
    <animate attributeName="width" from="0" to="322" dur="1.1s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1" values="0;322"/>
  </rect>
  <text x="730" y="165" font-family="Consolas, Menlo, monospace" font-size="11" fill="#5b6b85">FREQUENT</text>

  <!-- ML stack -->
  <text x="28" y="214" font-family="Consolas, Menlo, monospace" font-size="14" fill="#c9d3e0">TensorFlow · OpenCV · sklearn</text>
  <rect x="250" y="200" width="460" height="10" rx="5" fill="#182234"/>
  <rect x="250" y="200" width="0" height="10" rx="5" fill="url(#barFill)">
    <animate attributeName="width" from="0" to="322" dur="1.1s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1" values="0;322"/>
  </rect>
  <text x="730" y="209" font-family="Consolas, Menlo, monospace" font-size="11" fill="#5b6b85">FREQUENT</text>

  <!-- cloud/tools -->
  <text x="28" y="258" font-family="Consolas, Menlo, monospace" font-size="14" fill="#c9d3e0">Docker · AWS · Linux</text>
  <rect x="250" y="244" width="460" height="10" rx="5" fill="#182234"/>
  <rect x="250" y="244" width="0" height="10" rx="5" fill="url(#barFill)">
    <animate attributeName="width" from="0" to="196" dur="1.1s" begin="0.75s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1" values="0;196"/>
  </rect>
  <text x="730" y="253" font-family="Consolas, Menlo, monospace" font-size="11" fill="#5b6b85">FAMILIAR</text>
</svg>
